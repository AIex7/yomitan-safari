<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Yomitan Action Popup</title>
    <link rel="icon" type="image/png" href="/images/icon16.png" sizes="16x16">
    <link rel="icon" type="image/png" href="/images/icon19.png" sizes="19x19">
    <link rel="icon" type="image/png" href="/images/icon32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/images/icon38.png" sizes="38x38">
    <link rel="icon" type="image/png" href="/images/icon48.png" sizes="48x48">
    <link rel="icon" type="image/png" href="/images/icon64.png" sizes="64x64">
    <link rel="icon" type="image/png" href="/images/icon128.png" sizes="128x128">
    <link rel="stylesheet" type="text/css" href="/css/material.css">
    <link rel="stylesheet" type="text/css" href="/css/action-popup.css">
    <script src="/js/pages/action-popup-main.js" type="module"></script>
</head>
<body>
    <div id="loading">
        Loading...
    </div>
    <div id="action-popup">
        <div class="action-container action-select-profile" hidden>
            <div class="action-item-left">
                <h2 class="action-title">Profile</h2>
            </div>
            <div class="action-item-right">
                <select tabindex="0"  class="profile-select" id="profile-select">
                </select>
            </div>
        </div>
        <div class="action-container action-scan-hint">
            <div class="action-item-center">
                <label class="toggle">
                    <input tabindex="0" type="checkbox" class="enable-search">
                    <div class="toggle-group">
                        <span class="toggle-on">On</span>
                        <span class="toggle-off">Off</span>
                        <span class="toggle-handle"></span>
                    </div>
                </label>
                <p class="tooltip">Hover over text to scan</p>
            </div>
        </div>
        <div class="action-container action-buttons">
            <button type="button" class="low-emphasis action-texthooker action-open-texthooker" title="TextHooker" aria-label="TextHooker" hidden>
                <div class="action-icon"><svg class="action-menu-symbol" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 11h6M9 15h6"/></svg></div>
                <span class="action-label">TextHooker</span>
            </button>
            <button type="button" class="low-emphasis action-image-viewer action-open-image-viewer" title="Images" aria-label="Images" hidden>
                <div class="action-icon"><svg class="action-menu-symbol" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="m4 17 5-5 4 4 3-3 4 4"/></svg></div>
                <span class="action-label">Images</span>
            </button>
            <button type="button" class="low-emphasis action-morphman action-toggle-morphman" title="Morphman" aria-label="Morphman" aria-pressed="false" hidden>
                <div class="action-icon"><svg class="action-menu-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h2a2.5 2.5 0 1 1 5 0h4v5a2.5 2.5 0 1 0 0 5v6h-6a2.5 2.5 0 1 0-5 0H4v-6a2.5 2.5 0 1 0 0-5V4h5Z"/></svg></div>
                <span class="action-label">Morphman</span>
            </button>
            <button tabindex="0" type="button" class="low-emphasis action-open-settings" title="Settings" data-hotkey='["global:openSettingsPage","title","Settings ({0})"]'>
                <div class="action-icon">
                    <span class="icon" data-icon="cog"></span><svg class="action-menu-symbol" viewBox="0 0 24 24" aria-hidden="true"><path d="m10 3-.6 2.3-2 .9-2.1-.7-2 3.5 1.5 1.7v2.6L3.3 15l2 3.5 2.1-.7 2 .9L10 21h4l.6-2.3 2-.9 2.1.7 2-3.5-1.5-1.7v-2.6l1.5-1.7-2-3.5-2.1.7-2-.9L14 3Z"/><circle cx="12" cy="12" r="3"/></svg>
                </div>
                <span class="action-label">Settings</span>
            </button>
            <button tabindex="0" type="button" class="low-emphasis action-open-search" title="Search&#010;Shift+click to open here" data-hotkey='["global:openSearchPage","title","Search ({0})\nShift+click to open here"]'>
                <div class="action-icon">
                    <span class="icon" data-icon="magnifying-glass"></span>
                </div>
            </button>
            <button tabindex="0" type="button" class="low-emphasis action-open-info" title="Information" data-hotkey='["global:openInfoPage","title","Information ({0})"]'>
                <div class="action-icon">
                    <span class="icon" data-icon="question-mark-circle"></span><svg class="action-menu-symbol" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".5"/></svg>
                </div>
                <span class="action-label">Information</span>
            </button>
        </div>
    </div>
</body>
</html>
