<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yomitan TextHooker</title>
    <link rel="icon" type="image/png" href="/images/icon16.png">
    <link rel="stylesheet" href="/css/texthooker.css">
    <script src="/js/pages/text-hooker-main.js" type="module"></script>

<body>

        <h1>TextHooker</h1>
