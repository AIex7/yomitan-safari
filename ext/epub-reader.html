<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>EPUB Reader — Yomitan</title>
    <link rel="icon" type="image/png" href="/images/icon16.png">
    <link rel="stylesheet" href="/css/epub-reader.css">
    <script type="module" src="/js/pages/epub-reader-main.js"></script>
</head>
<body>
    <div class="reader-layout">
        <aside id="contents" class="scan-disable" hidden aria-label="Table of contents"><h2>Contents</h2><nav id="chapter-links"></nav></aside>
        <main id="reading-area" tabindex="0" aria-label="Book text">
            <div id="empty-state">
                <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 12C17 7 9 8 5 10v29c5-2 12-2 19 2 7-4 14-4 19-2V10c-4-2-12-3-19 2Zm0 0v29"/></svg>
                <h1>A little room to read.</h1>
                <p>Open an EPUB, or drop one here.</p>
                <p class="empty-hint">Arrow keys turn pages. Use your Yomitan lookup key over a word.</p>
            </div>
            <article id="chapter" hidden></article>
        </main>
    </div>
    <footer class="toolbar scan-disable">
        <div class="toolbar-group">
            <button id="open-book" type="button">Open EPUB…</button>
            <button id="toggle-contents" class="icon-button" type="button" title="Table of contents" aria-label="Table of contents" aria-expanded="false" aria-controls="contents" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M13 9h4M13 13h4"/></svg></button>
        </div>
        <div class="book-heading"><strong id="book-title">EPUB Reader</strong><span id="book-author"></span></div>
        <div class="toolbar-group">
            <details id="appearance">
                <summary title="Reading appearance" aria-label="Reading appearance">Aa</summary>
                <div class="appearance-panel">
                    <label>Text size <input id="font-size" type="range" min="16" max="36" value="22"><output id="font-size-label">22 px</output></label>
                    <label>Typeface <select id="typeface"><option value="serif">Book</option><option value="sans">System</option></select></label>
                    <label>Appearance <select id="theme"><option value="system">System</option><option value="light">Light</option><option value="paper">Paper</option><option value="dark">Dark</option></select></label>
                    <label>Layout <select id="writing-mode"><option value="horizontal">Horizontal</option><option value="vertical">Vertical Japanese</option></select></label>
                </div>
            </details>
            <button id="previous" class="icon-button" type="button" title="Previous page" aria-label="Previous page" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button>
            <button id="next" class="icon-button" type="button" title="Next page" aria-label="Next page" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg></button>
        </div>
        <input id="book-file" type="file" accept=".epub,application/epub+zip" hidden>
        <select id="chapter-select" aria-label="Current chapter" disabled><option>No book open</option></select>
        <span id="position" aria-live="off"></span>
        <span id="status" role="status" aria-live="polite"></span>
    </footer>
    <div id="drop-hint" hidden>Drop EPUB to open</div>
</body>
</html>
